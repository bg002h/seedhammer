name: "Test"
on:
  pull_request:
  push:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
        go-version: '1.26'
    # NOTHING HERE SKIPS, and nothing here is turned off by an environment
    # variable. Operator directive, 2026-08-15: "Don't skip jobs unless I ask."
    #
    # Every gate that checks this Go firmware against the Rust primary — the
    # derived-census comparison, S2's md1 byte-identity gate, the pin-resolution
    # test, the whole sysw conformance suite — used to skip on THIS runner, on
    # every push, while the step below printed `ok` and exit 0. Measured: run
    # 31898063163, on 4b8488e, concluded success with all of it unexecuted
    # (C-1..C-4).
    #
    # The repair is not an opt-out and not a Rust install. It is that the thing
    # compared against is COMMITTED: the primary's own output, minted only by a
    # live derivation, carrying the oracle identity it was minted from. So the
    # comparison needs no toolchain and has no branch that could decline it:
    #
    #   oracle  TestEveryGateRecordCensusMatchesItsCommittedExpectation
    #             every gate record's engraved census vs the primary's own
    #             output committed beside it, byte for byte, in order
    #           TestVendoredExpectationsWereDerivedFromThePinnedToolchain
    #             every committed expectation's oracle identity vs pins.json
    #   gui     TestAssembledMd1MatchesTheCommittedGolden
    #             S2's md1 assembly vs the primary's committed output
    #   sysw    TestConformance + TestVendoredVectorsMatchTheirProvenancePin
    #             this port vs the Rust primary's generated vector set
    #
    # Their package's `ok` therefore IMPLIES they executed.
    #
    # Installing the oracles here is not an alternative that was skipped over:
    # oracle/pins.json binds each to the SHA-256 of a binary built on the
    # maintainer's machine, so a `cargo install` here produces a different
    # binary, a different hash, and a hard resolution failure.
    # -timeout 20m RAISES A CEILING; IT SKIPS NOTHING. Go's default is 10m PER
    # PACKAGE, and `gui` is ~93% of this suite on one core -- it has no
    # t.Parallel() anywhere, so extra cores do not help it. Measured on the
    # maintainer's 24-core box at the S6b merge, exactly as CI invokes it:
    #
    #   $ CGO_ENABLED=0 go test ./gui/ -count=1
    #   ok  seedhammer.com/gui  476.309s      <- 79% of the 600s default
    #
    # THEN MEASURED HERE, and the prediction was WRONG. This flag was added
    # arguing the runner is slower per core and the default was "odds-on to
    # expire". Run 32155309524, the first push carrying it:
    #
    #   ok  seedhammer.com/gui  386.065s      <- 64% of the default
    #
    # The runner is FASTER than the maintainer's box for this workload -- 90s
    # faster -- so the default would have held, with 214s to spare. Recorded
    # rather than quietly deleted: the number a future reader needs is the one
    # from THIS machine, and the guess it replaces was off by the wrong sign.
    #
    # The flag stays, on the weaker and honest ground: `gui` grew 440.6s ->
    # 496.8s in a SINGLE S6b phase, so 214s of headroom is a cycle or two, not
    # a margin. And a package killed by the timeout is not a small failure --
    # it reports a panic over a suite whose assertions had all been passing,
    # which reads like a code defect and is not one. The 10m default is not a
    # budget anyone chose for this suite; it is what Go picks when nobody says.
    #
    # If this number ever needs raising again, the answer is probably not a
    # bigger number: `gui` grew 440.6s -> 496.8s in a single S6b phase. Shard it
    # (scripts/gui-shard-test.sh in mnemonic-engrave partitions it from
    # `go test -list` and ASSERTS the partition is exhaustive before running)
    # or give its tests t.Parallel().
    - run: CGO_ENABLED=0 go test -timeout 20m ./...
    # A COMPILE CHECK, and deliberately only that. The live re-derivation against
    # the pinned md/mk/ms is not a test that skips here — under the `oraclelive`
    # tag it does not exist in this build at all, and a maintainer runs it by
    # name (./scripts/oracle-live.sh). But a check behind a build tag is an
    # excellent place for code to rot uncompiled, so the tagged files are BUILT
    # on every push, for the same reason the GOOS=js step below gives: a gate
    # whose instrument does not compile is not a gate.
    #
    # `-run '^$'` compiles the tagged test binaries and runs no test, because the
    # tests inside need Rust binaries this runner cannot have (see the step
    # above). This is not a skipped check — it is a build, and it reports "[no
    # tests to run]" rather than pretending anything was verified.
    #
    # PROVEN TO BITE: a deliberate type error in oracle/live_test.go makes this
    # step exit 1 with "too many arguments in call to resolveBins" while the
    # untagged `go test ./...` above stays green — which is exactly the rot this
    # exists to catch.
    #
    # `go test` rather than `go vet`: vet reports 40 pre-existing findings in
    # _test.go files across this tree (33 bezier.Point unkeyed literals, 7
    # testing.ArtifactDir), so a vet step here would fail on day one for reasons
    # unrelated to this build. `go test` runs its own narrower vet subset, which
    # this tree already passes.
    #
    # ./cmd/emu/ joined the list when cmd/emu/sysw_composer_payload_live_test.go
    # was added: a tagged file no step compiles is a file that rots, which is
    # the whole reason this step exists.
    - run: CGO_ENABLED=0 go test -tags oraclelive -run '^$' ./oracle/ ./gui/ ./sysw/ ./cmd/emu/
    # F-142: `int` is 64 bits here and 32 bits on the device, so a uint32 read
    # off the wire and widened to `int` behaves differently on the machine than
    # in CI. It already did: ParseHeader compared the section cap as
    # `int(h.PubLen)`, so pub_len=0xFFFFFFFF became -1, slipped the cap, and gave
    # TotalLen()==67 -- a plausible small positive length the device would have
    # accepted for a payload the host calls malformed. The shared vectors could
    # not have caught it: they are evaluated at the BUILDER's word size. Proven
    # to bite -- restoring the old comparison passes the line above, fails this.
    - run: ./scripts/test-32bit.sh
    # The emulator is a GOOS=js build, and NOTHING above compiles it: `go test
    # ./...` builds cmd/emu's //go:build !js stub (main_notjs.go, which exists
    # so repo-wide commands do not fail here) and never touches platform.go,
    # walk_js.go, screen_js.go, toolpath_js.go or nfc_js.go. That left the whole
    # emulator -- including the walk harness the plan makes the closing gate of
    # every stage -- checked by nobody but a human remembering to run
    # cmd/emu/build.sh. A gate whose instrument does not compile is not a gate.
    #
    # vet rather than build, because it type-checks the package and reports
    # more; it subsumes the compile.
    - run: GOOS=js GOARCH=wasm go vet ./cmd/emu/
  tinygo-device-build:
    # The TinyGo pico-plus2 build of ./cmd/controller compiles the whole
    # gui -> codex32 import graph, so it exercises codex32 (incl. the dormant
    # GF(1024)/BCH decoder gf1024.go/correct.go) under the 32-bit device
    # target. Host `go test` never compiles the TinyGo build, so enforce it
    # here on every PR/push. Uses the repo's established Nix tinygo toolchain
    # and the same -target pico-plus2 flags as build-firmware.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: cachix/install-nix-action@v31.10.6
      with:
        nix_path: nixpkgs=channel:nixos-25.11
    - uses: DeterminateSystems/magic-nix-cache-action@v14
    - name: TinyGo device build (covers codex32) + size & stack report
      run: nix develop --command tinygo build -size full -print-stacks -o /dev/null -target pico-plus2 -stack-size 16kb -gc precise -opt 2 -scheduler tasks ./cmd/controller
