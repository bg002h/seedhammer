name: "Test"
on:
  pull_request:
  push:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
        go-version: '1.26'
    # SH_ORACLES_OPTIONAL=1: this runner has no Rust toolchain, so the LIVE
    # re-derivation against the pinned md/mk/ms binaries cannot run here. It is
    # not merely absent — it is unachievable: oracle/pins.json binds each oracle
    # to the SHA-256 of a binary built on the maintainer's machine, so a
    # `cargo install` here would produce a different binary, a different hash,
    # and a hard resolution failure.
    #
    # WHAT STILL ENFORCES BYTE-IDENTITY ON THIS MACHINE, in full, because a line
    # that relaxes a gate has to say what is left:
    #
    #   oracle  TestEveryGateRecordCensusMatchesItsCommittedExpectation
    #             every gate record's engraved census vs the primary's own
    #             output committed beside it, byte for byte, in order
    #           TestVendoredExpectationsWereDerivedFromThePinnedToolchain
    #             every committed expectation's oracle identity vs pins.json
    #   gui     TestAssembledMd1MatchesTheCommittedGolden
    #             S2's md1 assembly vs the primary's committed output
    #   sysw    TestConformance + TestVendoredVectorsMatchTheirProvenancePin
    #             this port vs the Rust primary's generated vector set
    #
    # NONE of those has a skip path. They need no toolchain, they run on every
    # push, and their package's `ok` therefore IMPLIES they executed — which is
    # the whole repair (C-1..C-4). Until 2026-08-15 all of it skipped here in
    # silence and the workflow still went green: run 31898063163, on 4b8488e,
    # concluded success with the derived-census gate, S2's byte-identity gate,
    # the pin-resolution test and the entire sysw conformance suite unexecuted.
    #
    # This variable may only ever RELAX a check. Nothing in this repo is armed by
    # setting an environment variable — the sysw pair already shipped that shape
    # (SYSW_REQUIRE_VECTORS=1 -> t.Fatalf) and it failed because no workflow ever
    # set it. An escalation nobody sets is a skip with paperwork.
    - run: CGO_ENABLED=0 SH_ORACLES_OPTIONAL=1 go test ./...
    # F-142: `int` is 64 bits here and 32 bits on the device, so a uint32 read
    # off the wire and widened to `int` behaves differently on the machine than
    # in CI. It already did: ParseHeader compared the section cap as
    # `int(h.PubLen)`, so pub_len=0xFFFFFFFF became -1, slipped the cap, and gave
    # TotalLen()==67 -- a plausible small positive length the device would have
    # accepted for a payload the host calls malformed. The shared vectors could
    # not have caught it: they are evaluated at the BUILDER's word size. Proven
    # to bite -- restoring the old comparison passes the line above, fails this.
    - run: ./scripts/test-32bit.sh
    # The emulator is a GOOS=js build, and NOTHING above compiles it: `go test
    # ./...` builds cmd/emu's //go:build !js stub (main_notjs.go, which exists
    # so repo-wide commands do not fail here) and never touches platform.go,
    # walk_js.go, screen_js.go, toolpath_js.go or nfc_js.go. That left the whole
    # emulator -- including the walk harness the plan makes the closing gate of
    # every stage -- checked by nobody but a human remembering to run
    # cmd/emu/build.sh. A gate whose instrument does not compile is not a gate.
    #
    # vet rather than build, because it type-checks the package and reports
    # more; it subsumes the compile.
    - run: GOOS=js GOARCH=wasm go vet ./cmd/emu/
  tinygo-device-build:
    # The TinyGo pico-plus2 build of ./cmd/controller compiles the whole
    # gui -> codex32 import graph, so it exercises codex32 (incl. the dormant
    # GF(1024)/BCH decoder gf1024.go/correct.go) under the 32-bit device
    # target. Host `go test` never compiles the TinyGo build, so enforce it
    # here on every PR/push. Uses the repo's established Nix tinygo toolchain
    # and the same -target pico-plus2 flags as build-firmware.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: cachix/install-nix-action@v31.10.6
      with:
        nix_path: nixpkgs=channel:nixos-25.11
    - uses: DeterminateSystems/magic-nix-cache-action@v14
    - name: TinyGo device build (covers codex32) + size & stack report
      run: nix develop --command tinygo build -size full -print-stacks -o /dev/null -target pico-plus2 -stack-size 16kb -gc precise -opt 2 -scheduler tasks ./cmd/controller
