name: "Build image"
on:
  create:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: "also run the nightly jobs (no nightly jobs in this workflow; accepted so the release gate can pass -f full=true everywhere)"
        type: boolean
        default: false
# Publishing workflow (builds the release firmware image): never cancel in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: cachix/install-nix-action@v31.10.6
      with:
        nix_path: nixpkgs=channel:nixos-25.11
    - uses: DeterminateSystems/magic-nix-cache-action@v14
    - name: Set version to GITHUB_SHA
      if: ${{ github.ref_type != 'tag' }}
      run: echo "version=${{ github.sha }}" >> $GITHUB_ENV
    - name: Set version to GITHUB_REF_NAME
      if: ${{ github.ref_type == 'tag' }}
      run: echo "version=${{ github.ref_name }}" >> $GITHUB_ENV
    - run: VERSION="${{ env.version }}" nix run .#build-firmware
    - uses: actions/upload-artifact@v7
      with:
        archive: false
        name: seedhammerii-${{ env.version }}.uf2
        path: seedhammerii-${{ env.version }}.uf2
